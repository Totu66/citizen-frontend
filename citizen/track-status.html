<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Status - Integrated Citizen Connect</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header>
    <h1>Integrated Citizen Connect</h1>
    <nav>
      <a href="submit-complaint.html">Report Issue</a>
      <a href="track-status.html" class="active">Track Status</a>
      <a href="#" id="logoutLink">Logout</a>
      <button class="theme-toggle" onclick="toggleTheme()">&#x1F319;</button>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <h2>My Reported Issues</h2>
      <p class="subtitle" style="color:#666;font-size:0.9rem;margin-bottom:1.5rem;">
        View the status and progress of issues you have reported.
      </p>
      <div id="alert-container"></div>
      <div id="complaintList"></div>
    </div>
  </div>

  <footer>&copy; 2026 Integrated Citizen Connect &mdash; Londiani Sub-County</footer>

  <script src="../assets/js/script.js"></script>
  <script>
    requireAuth();
    const _user = getUser();
    if (_user && _user.role === 'admin') window.location.href = '../admin/dashboard.html';

    document.getElementById('logoutLink').addEventListener('click', (e) => {
      e.preventDefault();
      clearAuth();
      window.location.href = '../index.html';
    });

    async function loadComplaints() {
      try {
        const res = await apiRequest('GET', '/complaints/mine');
        const list = document.getElementById('complaintList');
        if (res.complaints.length === 0) {
          list.innerHTML = '<p style="color:#666;">You have not reported any issues yet. <a href="submit-complaint.html">Report an issue</a></p>';
          return;
        }
        let html = '<table><thead><tr><th>Date</th><th>Category</th><th>Title</th><th>Status</th><th>Priority</th><th>Action</th></tr></thead><tbody>';
        for (const c of res.complaints) {
          html += '<tr>' +
            '<td>' + formatDate(c.created_at) + '</td>' +
            '<td>' + c.category + '</td>' +
            '<td>' + c.title + '</td>' +
            '<td>' + statusBadge(c.status) + '</td>' +
            '<td>' + priorityBadge(c.priority) + '</td>' +
            '<td><button class="btn btn-sm btn-primary" onclick="viewDetails(\'' + c._id + '\')">View</button></td>' +
            '</tr>';
        }
        html += '</tbody></table>';
        list.innerHTML = html;
      } catch (err) {
        showAlert(err.message, 'danger');
      }
    }

    async function viewDetails(id) {
      try {
        const res = await apiRequest('GET', '/complaints/' + id);
        const c = res.complaint;
        const responses = res.responses || [];
        let detailsHtml = '<div class="card mt-1" style="border:1px solid #e0e0e0;">';
        detailsHtml += '<h3>' + c.title + '</h3>';
        detailsHtml += '<p><strong>Category:</strong> ' + c.category + '</p>';
        detailsHtml += '<p><strong>Location:</strong> ' + c.location + '</p>';
        detailsHtml += '<p><strong>Description:</strong> ' + c.description + '</p>';
        detailsHtml += '<p><strong>Status:</strong> ' + statusBadge(c.status) + '</p>';
        detailsHtml += '<p><strong>Priority:</strong> ' + priorityBadge(c.priority) + '</p>';
        detailsHtml += '<p><strong>Reported on:</strong> ' + formatDate(c.created_at) + '</p>';

        if (responses.length > 0) {
          detailsHtml += '<h4 class="mt-2" style="color:#1a3a5c;">Responses from Leaders</h4>';
          for (const r of responses) {
            detailsHtml += '<div style="background:#f8fafc;padding:1rem;border-radius:6px;margin-bottom:0.5rem;">';
            detailsHtml += '<p><strong>Department:</strong> ' + (r.department || 'N/A') + '</p>';
            detailsHtml += '<p><strong>Action Taken:</strong> ' + r.action_taken + '</p>';
            detailsHtml += '<p><strong>Remarks:</strong> ' + (r.remarks || 'N/A') + '</p>';
            detailsHtml += '<p style="font-size:0.8rem;color:#888;">' + formatDate(r.responded_at) + '</p>';
            detailsHtml += '</div>';
          }
        } else {
          detailsHtml += '<p class="mt-1" style="color:#888;">No responses yet from the leaders.</p>';
        }
        detailsHtml += '<button class="btn btn-sm btn-primary mt-1" onclick="document.getElementById(\'detailModal\').remove()">Close</button>';
        detailsHtml += '</div>';

        const existing = document.getElementById('detailModal');
        if (existing) existing.remove();
        const div = document.createElement('div');
        div.id = 'detailModal';
        div.innerHTML = '<div class="container">' + detailsHtml + '</div>';
        document.querySelector('.container').after(div);
      } catch (err) {
        showAlert(err.message, 'danger');
      }
    }

    loadComplaints();
  </script>
</body>
</html>
