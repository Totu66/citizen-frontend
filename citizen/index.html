<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integrated Citizen Connect - Login</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header>
    <h1>Integrated Citizen Connect</h1>
    <nav>
      <a href="index.html" class="active">Login</a>
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">&#x1F319;</button>
    </nav>
  </header>

  <div class="auth-wrapper">
    <div class="card">
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to your account</p>
      <div id="alert-container"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
      </form>
      </div>
    </div>
  </div>

  <footer>&copy; 2026 Integrated Citizen Connect &mdash; Londiani Sub-County</footer>

  <script src="../assets/js/script.js"></script>
  <script>
    redirectIfLoggedIn();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const res = await apiRequest('POST', '/auth/login', { email, password });
        if (res.user.role === 'admin') {
          showAlert('Admins cannot log in here. Use the Admin Portal instead.', 'danger');
          return;
        }
        setAuth(res.token, res.user);
        window.location.href = 'submit-complaint.html';
      } catch (err) {
        showAlert(err.message, 'danger');
      }
    });
  </script>
</body>
</html>
