<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - Integrated Citizen Connect</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <header>
    <h1>Admin Panel &mdash; Londiani Sub-County</h1>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="manage-issues.html">Manage Issues</a>
      <a href="reports.html" class="active">Reports</a>
      <a href="#" id="logoutLink">Logout</a>
      <button class="theme-toggle" onclick="toggleTheme()">&#x1F319;</button>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem;">
        <h2 style="margin:0;">Issues Report Summary &mdash; Londiani Sub-County</h2>
        <div>
          <button class="btn btn-sm btn-primary" onclick="printReport()">Print</button>
          <button class="btn btn-sm btn-success" onclick="downloadReportPDF()">Download PDF</button>
        </div>
      </div>
      <div id="alert-container"></div>

      <div id="reportContent">
        <div class="grid-2 mb-2" id="summaryCards"></div>

        <div class="filter-bar">
          <label style="font-weight:600;align-self:center;">Filter by Category:</label>
          <select id="categoryFilter" onchange="loadReport()">
            <option value="">All Categories</option>
            <option value="roads">Roads</option>
            <option value="water">Water</option>
            <option value="sanitation">Sanitation</option>
            <option value="health">Health</option>
            <option value="security">Security</option>
            <option value="electricity">Electricity</option>
          </select>
        </div>

        <div id="reportTable"></div>
      </div>
    </div>
  </div>

  <footer>&copy; 2026 Integrated Citizen Connect &mdash; Londiani Sub-County</footer>

  <script src="../assets/js/script.js"></script>
  <script>
    const user = getUser();
    if (!user || user.role !== 'admin') window.location.href = 'login.html';

    document.getElementById('logoutLink').addEventListener('click', (e) => {
      e.preventDefault();
      clearAuth();
      window.location.href = '../index.html';
    });

    function printReport() {
      const content = document.getElementById('reportContent');
      if (!content) { showAlert('No data to print.', 'danger'); return; }
      const win = window.open('', '_blank');
      win.document.write('<html><head><title>Issues Report Summary</title><style>');
      win.document.write('body{font-family:"Segoe UI",sans-serif;padding:2rem;}');
      win.document.write('table{width:100%;border-collapse:collapse;margin-top:1rem;}');
      win.document.write('th,td{padding:0.5rem;text-align:left;border:1px solid #ccc;font-size:0.8rem;}');
      win.document.write('th{background:#f0f4f8;}');
      win.document.write('.stat-card{display:inline-block;padding:0.5rem 1rem;margin:0.3rem;border:1px solid #ddd;border-radius:6px;text-align:center;min-width:90px;}');
      win.document.write('.stat-card h3{font-size:0.75rem;margin-bottom:0.2rem;}');
      win.document.write('.stat-card .number{font-size:1.2rem;font-weight:700;}');
      win.document.write('</style></head><body>');
      win.document.write('<h2>Issues Report Summary &mdash; Londiani Sub-County</h2>');
      win.document.write('<p>Generated: ' + new Date().toLocaleString() + '</p>');
      win.document.write(content.innerHTML);
      win.document.write('</body></html>');
      win.document.close();
      win.print();
    }

    async function downloadReportPDF() {
      const element = document.getElementById('reportContent');
      if (!element || !element.querySelector('table')) { showAlert('No data to download.', 'danger'); return; }
      showAlert('Generating PDF...', 'info');
      const opt = {
        margin: [0.5, 0.5, 0.5, 0.5],
        filename: 'issues_report_' + new Date().toISOString().slice(0, 10) + '.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' }
      };
      await html2pdf().set(opt).from(element).save();
    }

    async function loadReport() {
      try {
        const category = document.getElementById('categoryFilter').value;
        let url = '/reports/summary';
        if (category) url += '?category=' + category;
        const res = await apiRequest('GET', url);

        document.getElementById('summaryCards').innerHTML =
          '<div class="stat-card"><h3>Total Issues</h3><div class="number">' + res.total + '</div></div>' +
          '<div class="stat-card"><h3>Resolved</h3><div class="number">' + res.resolved + '</div></div>' +
          '<div class="stat-card"><h3>Unresolved</h3><div class="number">' + (res.total - res.resolved) + '</div></div>' +
          '<div class="stat-card"><h3>Resolution Rate</h3><div class="number">' + (res.total ? Math.round(res.resolved / res.total * 100) : 0) + '%</div></div>';

        const data = res.breakdown || [];
        let html = '<table><thead><tr><th>Category</th><th>Total</th><th>Pending</th><th>Under Review</th><th>In Progress</th><th>Resolved</th></tr></thead><tbody>';
        if (data.length === 0) {
          html += '<tr><td colspan="6" style="text-align:center;color:#666;">No data available</td></tr>';
        } else {
          for (const row of data) {
            html += '<tr><td>' + (row._id || category || 'All') + '</td><td>' + row.total + '</td><td>' + (row.pending || 0) + '</td><td>' + (row.under_review || 0) + '</td><td>' + (row.in_progress || 0) + '</td><td>' + (row.resolved || 0) + '</td></tr>';
          }
        }
        html += '</tbody></table>';
        document.getElementById('reportTable').innerHTML = html;
      } catch (err) {
        showAlert(err.message, 'danger');
      }
    }

    loadReport();
  </script>
</body>
</html>
